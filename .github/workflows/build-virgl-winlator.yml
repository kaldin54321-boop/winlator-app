name: Build VirGL (virpipe) for Winlator Frost v3 (aarch64 glibc)

# Produces ONE archive, matching exactly what this project's
# XServerDisplayActivity.extractGraphicsDriverFiles() extracts for the
# OpenGL slot (VirGL is OpenGL-slot-only; there is no VirGL Vulkan ICD):
#   virgl-<version>.tzst
#     usr/lib/libGL.so.1.7.0  -> virpipe gallium driver baked straight into
#                                classic libGL (Xlib GLX target, NOT a separate
#                                dri/*.so plugin)
# The archive may ALSO conditionally contain private bundled copies, added
# automatically only if the produced binary actually links against them
# (detected via readelf after the build):
#   usr/lib/libtinfo.so.6, usr/lib/libsensors.so.5,
#   usr/lib/libxcb-xfixes.so.0, usr/lib/libxshmfence.so.1,
#   usr/lib/libxcb-keysyms.so.1
#
# Frost-v3 integration (see GraphicsDrivers.VIRGL, DefaultVersion.VIRGL,
# XServerDisplayActivity.extractGraphicsDriverFiles):
#   - OpenGL slot "VirGL" extracts
#       assets/graphics_driver/virgl-<DefaultVersion.VIRGL>.tzst
#     into RootFS rootDir (<files>/rootfs). After dropping the produced
#     .tzst under app/app/src/main/assets/graphics_driver/, bump
#     DefaultVersion.VIRGL to the built version (e.g. "25.0.0"). No other
#     app change is needed:
#     - the cacheId already contains DefaultVersion.valueOf("virgl"), so the
#       version bump alone forces a one-time re-extract AND drops the stale
#       on-disk Mesa shader cache (compiled code from 23.1.9 must never be
#       reused -- its keys do not capture the driver build);
#     - env is already owned by the VIRGL branch (GALLIUM_DRIVER=virpipe,
#       VIRGL_NO_READBACK=true, VIRGL_SERVER_PATH plus VirGLConfigDialog
#       extras) -- do NOT add overrides here;
#     - mesaDriverMode stays true (the default): virgl is served by the
#       Mesa-dialect GLX like zink/llvmpipe; only Gladio opts out;
#     - verification expects exactly libGL.so.1.7.0 for every OpenGL slot,
#       which is what this archive provides (the base rootfs ships the
#       libGL.so.1 symlink pointing at it).
#   - aaptOptions already has noCompress for tzst, so no gradle change needed.
#
# Host side (NOT built here, intentionally): the in-app libvirglrenderer.so
# under app/.../cpp/virglrenderer stays as-is. The virgl wire protocol is
# backwards compatible -- a newer Mesa guest (this archive) talking to the
# existing host renderer snapshot is the supported direction (same as distro
# guests updating Mesa against a stable host). If glitches persist after
# this update on an otherwise clean device, the host renderer snapshot is
# the next suspect, not this archive.
#
# Design notes:
#   - Builds run INSIDE a real aarch64 container via QEMU user-mode emulation
#     (docker/setup-qemu-action), not manual dpkg --add-architecture
#     cross-compiling. See build-llvmpipe-winlator.yml for the full rationale
#     (ldconfig SIGSEGV defense, --no-triggers hardening, jammy/glibc-2.35
#     baseline). All of it applies verbatim here and is repeated below.
#   - VERSION PIN: default Mesa 25.0.0 -- the same Mesa family as the proven
#     working llvmpipe-25.0.0 asset, so guest shader behavior and the X
#     server protocol it was verified against stay in one known-good family.
#     Mesa 24.0.x is also accepted via the mesa_version input (same recipe,
#     no removed-option hazards in the 24-25 range). Do NOT point this at
#     Mesa 26.x without on-device proof: the in-house 26.0.0 llvmpipe build
#     enumerated correctly yet rendered clear-color/black only (shared
#     rasterizer output nothing, plausibly misbuilt under QEMU user-mode CI).
#   - LLVM is DELIBERATELY NOT INSTALLED and -Dllvm=disabled is MANDATORY.
#     The virpipe gallium driver has no JIT: it forwards TGSI over the virgl
#     wire protocol to the host renderer, so there is nothing to compile
#     guest-side. Enabling LLVM would only bloat libGL with a statically
#     linked compiler backend plus its libtinfo/libsensors/libzstd fallout
#     for zero rendering benefit. (Contrast llvmpipe, where llvm=enabled +
#     static link is mandatory because the rasterizer IS an LLVM JIT.)
#   - No glslangValidator step: with -Dvulkan-drivers= (empty) there is no
#     Vulkan ICD to build, so nothing searches for it. (The llvmpipe flow
#     needs a source-built glslangValidator only because lavapipe does.)
#   - -Dglx=xlib is the key option: it bakes the virpipe gallium driver
#     directly into libGL.so instead of producing a separate loadable
#     dri/*.so plugin, which is what lets the final package be the single
#     self-contained libGL.so.1.7.0 file the extraction code expects -- the
#     exact shape of the current virgl-23.1.9.tzst and zink-22.2.5.tzst.
#   - -Dglx-direct=true: explicit direct-rendering intent (client-side virpipe
#     raster into SHM pixmaps via MIT-SHM/DRI3, which this X server
#     implements). This is the default, but spelling it out protects against
#     a future Mesa default flip silently moving us to indirect protocol
#     rendering.
#   - -Ddri3 does NOT exist as a meson option in Mesa >= 25.0.0 (removed
#     upstream). Do not re-add it: `meson setup` fails outright with
#     "Unknown option: dri3".
#   - shared-glapi is DELIBERATELY NOT PASSED. The shipped virgl-23.1.9 libGL
#     carries a libglapi.so.0 NEEDED entry satisfied by the copy the base
#     rootfs ships (verified in rootfs.tzst); the Mesa 25/26 xlib target
#     embeds glapi instead (proven on the llvmpipe-25.0.0 asset: no NEEDED
#     entry, 70+ glX symbols in dynsym). Either linkage is CORRECT here, so
#     the workflow detects which one the build produced and gates it
#     accordingly instead of forcing one: NEEDED libglapi -> the CI gate
#     proves the rootfs copy satisfies the loader (never bundled -- shadowing
#     the rootfs file would risk breaking the zink slot, which shares it);
#     no NEEDED -> self-contained, nothing to prove. Passing the option
#     explicitly is a future landmine (deprecated in 26, removal would fail
#     `meson setup` outright, exactly like -Ddri3 did), so it stays omitted.
#   - -Dzstd=disabled: falls back to zlib for the on-disk shader cache. With
#     llvm=disabled no static-LLVM link can re-add a libzstd NEEDED behind
#     our back; the CI gate still proves every NEEDED against the rootfs
#     inventory, so a surprise is caught loudly rather than shipping a dead
#     driver. (The base rootfs ships a NEWER libzstd than jammy anyway, same
#     policy as libz/libdrm/libX11: rootfs-provided, never bundled.)
#   - Extra gallium media/VDPAU/VA/CL targets are left at Mesa defaults: with
#     gallium-drivers=virgl they are either skipped or built but never
#     packaged (only libGL.so.* is collected). Deliberately NOT passing
#     -Dgallium-va/-Dgallium-vdpau/-Dgallium-omx: their exact option spelling
#     changed across Mesa majors and a wrong spelling fails `meson setup`
#     outright. Unpackaged extras cost a few build minutes, never correctness.
#   - Mesa's meson needs >= 1.3 (jammy ships 0.61), so a pinned modern meson
#     comes via pip -- same reasoning as the llvmpipe flow (no venv: jammy
#     has no ensurepip; no --break-system-packages: jammy pip 22.0.2 predates
#     the flag and has no PEP 668 guard).
#   - Python on jammy is 3.10, satisfying Mesa's >= 3.10 floor; mako/yaml/ply
#     come from apt (same package list as the llvmpipe flow minus LLVM).

on:
  workflow_dispatch:
    inputs:
      mesa_version:
        description: "Mesa version to build (must exist as mesa-<ver>.tar.xz on archive.mesa3d.org; 25.0.0 recommended, 24.0.x also supported)"
        required: true
        default: "25.0.0"

env:
  MESA_VERSION: ${{ github.event.inputs.mesa_version || '25.0.0' }}
  TARGET_TRIPLE: aarch64-linux-gnu

jobs:
  build-virgl:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Mandatory: registers binfmt_misc handlers so the amd64 runner can
      # execute aarch64 ELF binaries transparently. Without this every
      # command inside --platform=linux/arm64 below fails with "exec format error".
      - name: Set up QEMU (aarch64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create output directory
        run: mkdir -p "${{ github.workspace }}/artifacts"

      - name: Write in-container build script
        run: |
          cat > "${{ github.workspace }}/build.sh" <<'BUILD_SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive

          MESA_VERSION="${MESA_VERSION:?}"

          echo "==> Neutralizing ldconfig inside the emulated container"
          # DETERMINISTIC fix for the QEMU user-mode ldconfig SIGSEGV (see
          # build-llvmpipe-winlator.yml: binfmt qemu v10.2.3, dpkg exit 139
          # on libc-bin, apt exit 100). Replacing ldconfig with a no-op is
          # safe: this build only needs files/headers/binaries on disk
          # (compiler/linker resolve via explicit -L paths from pkg-config,
          # never via the ld.so cache), and nothing on-device uses
          # ld.so.cache either (the Android linker ignores it). The container
          # is ephemeral (docker run --rm), so no restore is needed.
          if LDCONFIG_PATH="$(command -v ldconfig)"; then
            mv "$LDCONFIG_PATH" "${LDCONFIG_PATH}.qemu-broken"
            printf '#!/bin/sh\nexit 0\n' > "$LDCONFIG_PATH"
            chmod +x "$LDCONFIG_PATH"
            echo "ldconfig neutralized at ${LDCONFIG_PATH}"
          fi

          echo "==> Updating apt and installing mandatory build dependencies"
          apt-get update
          echo "==> Confirming base image glibc version"
          ldd --version | head -n1 || true
          # NOTE: deliberately NO llvm-dev / clang / glslang packages here.
          # virpipe needs no guest-side JIT (-Dllvm=disabled below) and no
          # Vulkan ICD is built (-Dvulkan-drivers= empty), so neither
          # toolchain is required. Fewer packages = smaller QEMU-emulated
          # install = fewer trigger passes over the neutralized ldconfig.
          # -o Dpkg::Options::="--no-triggers" is still MANDATORY under QEMU
          # user-mode emulation (see comment above); a best-effort
          # `ldconfig || true` afterwards refreshes the cache when the
          # emulator can.
          apt-get -o Dpkg::Options::="--no-triggers" install -y --no-install-recommends \
            ca-certificates curl xz-utils git \
            build-essential pkg-config cmake ninja-build \
            python3 python3-pip python3-setuptools python3-wheel \
            python3-mako python3-yaml python3-ply \
            bison flex \
            zstd \
            zlib1g-dev libexpat1-dev \
            libdrm-dev \
            libx11-dev libxext-dev libxfixes-dev libxcb1-dev libxcb-glx0-dev \
            libxcb-shm0-dev libxcb-dri2-0-dev libxcb-dri3-dev libxcb-present-dev \
            libxcb-randr0-dev libxcb-sync-dev libxcb-xfixes0-dev \
            libx11-xcb-dev libxcb-keysyms1-dev \
            libxshmfence-dev libxxf86vm-dev libxrandr-dev
          # Best-effort cache refresh; failure is tolerated (see above).
          ldconfig || true

          # Mesa 25.x needs a meson newer than what jammy packages, so pin a
          # known-good modern meson via pip, installed straight into the
          # system interpreter. Deliberately NOT using `python3 -m venv`
          # (needs the separate python3.10-venv package which isn't installed
          # by default) and deliberately NOT running "pip install --upgrade
          # pip" first (the apt-installed pip has no RECORD metadata, so its
          # self-uninstall step fails) and NOT passing --break-system-packages
          # (that flag only exists on pip 23.0.1+; jammy ships pip 22.0.2,
          # which errors with "no such option" -- and jammy has no PEP 668
          # externally-managed guard in the first place).
          echo "==> Installing pinned meson via pip (system interpreter)"
          python3 -m pip install "meson>=1.4,<2.0"
          hash -r
          meson --version

          echo "==> Fetching Mesa ${MESA_VERSION} source"
          mkdir -p /build && cd /build
          # Retry flags: apt.llvm.org / archive.mesa3d.org are intermittently
          # unreachable from CI (transient curl exit 7 against one host while
          # others work). Zero behavior change on success.
          curl -fL --retry 5 --retry-delay 15 --retry-all-errors \
            -o "mesa-${MESA_VERSION}.tar.xz" \
            "https://archive.mesa3d.org/mesa-${MESA_VERSION}.tar.xz"
          tar xf "mesa-${MESA_VERSION}.tar.xz"
          cd "mesa-${MESA_VERSION}"

          echo "==> Configuring build (single-file classic libGL with virpipe baked in)"
          # gallium-drivers=virgl  -> the ONLY gallium driver being built; the
          #                            xlib libGL below contains virpipe and
          #                            nothing else, so the app's
          #                            GALLIUM_DRIVER=virpipe always resolves
          # vulkan-drivers= (empty) -> virgl is OpenGL-slot-only; no ICD, no
          #                            manifest, no glslangValidator needed
          # glx=xlib                 -> MANDATORY for a single self-contained
          #                             libGL.so: bakes virpipe straight into
          #                             libGL instead of a separate dri/*.so
          #                             plugin loaded via DRI search path --
          #                             the exact shape of virgl-23.1.9.tzst
          # egl/gbm disabled          -> not part of the package frost-v3
          #                             expects for this driver; omit to avoid
          #                             producing files that won't be shipped
          # llvm=disabled            -> MANDATORY (see header): virpipe has no
          #                             JIT, it forwards TGSI to the host
          # shared-llvm=disabled     -> belt and braces: with llvm disabled
          #                             there is nothing to share, but the
          #                             spelling `disabled` (not `false`)
          #                             keeps `meson setup` working if a
          #                             future Mesa deprecates/removes `false`
          # glx-direct=true           -> explicit direct-rendering intent:
          #                             virpipe rasters client-side into SHM
          #                             pixmaps via MIT-SHM/DRI3, which this X
          #                             server implements
          # shared-glapi OMITTED       -> see header: either linkage (embedded
          #                             or rootfs-provided libglapi) is correct;
          #                             the post-build gates handle both, and
          #                             omitting dodges the deprecation/removal
          #                             landmine
          # -Ddri3 OMITTED            -> removed upstream as of 25.0.0;
          #                             passing it fails `meson setup` outright
          meson setup build \
            --prefix=/output/usr \
            --libdir=lib \
            --buildtype=release \
            -Db_ndebug=true \
            -Dplatforms=x11 \
            -Dgallium-drivers=virgl \
            -Dvulkan-drivers= \
            -Dglx=xlib \
            -Dglx-direct=true \
            -Degl=disabled \
            -Dgbm=disabled \
            -Dopengl=true \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Dllvm=disabled \
            -Dshared-llvm=disabled \
            -Dzstd=disabled \
            -Dvalgrind=disabled \
            -Dlibunwind=disabled \
            -Dtools= \
            -Dvulkan-layers=

          echo "==> Building"
          ninja -C build -j"$(nproc)"

          echo "==> Installing to staging root"
          ninja -C build install

          echo "==> Locating build outputs"
          LIBDIR="/output/usr/lib"
          # The xlib libGL installs version-suffixed (e.g. libGL.so.1.5.0 on
          # Mesa 26, libGL.so.1.7.0 on older majors); accept any suffix and
          # ship it under the 1.7.0 name the rootfs libGL.so.1 symlink points
          # at. SONAME stays libGL.so.1 either way (gated below), so the
          # rename is filename-only and loader-safe -- same convention as the
          # llvmpipe-opengl package.
          GL_SRC="$(find "$LIBDIR" -maxdepth 1 -name 'libGL.so.*' -type f | sort -V | tail -n1)"
          if [ -z "$GL_SRC" ] || [ ! -f "$GL_SRC" ]; then
            echo "FATAL: no libGL.so.* produced by the xlib GLX target" >&2
            exit 1
          fi

          echo "==> Asserting the baked gallium driver is virpipe (not llvmpipe/zink)"
          # GALLIUM_DRIVER=virpipe (set app-side) only resolves if virpipe is
          # actually compiled into this libGL. A misconfigured gallium-drivers
          # value would silently produce a libGL that loads yet serves no
          # virpipe device -- the "driver not detected" signature. Fail here.
          if ! grep -qa 'virpipe' "$GL_SRC"; then
            echo "FATAL: virpipe not found in $GL_SRC -- gallium-drivers=virgl did not take effect" >&2
            exit 1
          fi
          if grep -qa 'llvmpipe' "$GL_SRC"; then
            echo "FATAL: llvmpipe found in $GL_SRC -- wrong gallium driver baked in" >&2
            exit 1
          fi
          echo "virpipe baked in OK"

          echo "==> Assembling the archive frost-v3's extraction code expects"
          # OpenGL slot "VirGL" extracts graphics_driver/virgl-<ver>.tzst
          # into RootFS rootDir (<files>/rootfs). Single-file package, same
          # shape as the current virgl-23.1.9.tzst (which contains exactly
          # usr/lib/libGL.so.1.7.0).
          rm -rf /pkg
          mkdir -p /pkg/virgl/usr/lib

          cp -a "$GL_SRC" /pkg/virgl/usr/lib/libGL.so.1.7.0

          echo "==> Reporting libglapi linkage (informational -- rootfs provides it)"
          # The 23.1.9 asset NEEDEDs libglapi.so.0 and resolves it from the
          # base rootfs copy; Mesa 25 xlib may instead embed glapi (no NEEDED).
          # Both are correct. libglapi is deliberately NEVER bundled here:
          # shadowing the rootfs file could break the zink slot, which shares
          # it. The CI gate below proves the rootfs copy satisfies the loader
          # whenever the NEEDED entry is present.
          if readelf -d /pkg/virgl/usr/lib/libGL.so.1.7.0 | grep -q 'NEEDED.*libglapi\.so\.0'; then
            echo "libGL NEEDEDs libglapi.so.0 -> will resolve from base rootfs (same as virgl-23.1.9)"
          else
            echo "libGL has no libglapi NEEDED -> glapi embedded, fully self-contained"
          fi

          echo "==> Checking for further runtime deps missing from Winlator rootfs and bundling private copies if needed"
          # Same self-healing technique as the llvmpipe workflow: detect from
          # the produced binary instead of assuming. With llvm=disabled the
          # static-LLVM fallout (libtinfo/libsensors) is not expected, but a
          # toolchain surprise must not ship a dead driver; the X11 WSI deps
          # below are the ones lavapipe proved missing from this rootfs
          # (Turnip's freedreno WSI never needed them, which is why the gap
          # stayed hidden). Their own transitive deps are only libc/libxcb,
          # both in the rootfs, so no dep chain to chase.
          # Deliberately NOT bundling libzstd.so.1 / libz / libdrm / libX11 /
          # libglapi even if NEEDED: the base rootfs already ships copies (it
          # ships a NEWER libzstd than jammy), and extracting ours would
          # DOWNGRADE a rootfs file that is never restored on driver switch.
          # The CI gate below proves each rootfs copy satisfies the loader.
          mkdir -p /tmp/extra-libs
          BUNDLE_DEPS="libtinfo.so.6|libtinfo6 libsensors.so.5|libsensors5 libxcb-xfixes.so.0|libxcb-xfixes0 libxshmfence.so.1|libxshmfence1 libxcb-keysyms.so.1|libxcb-keysyms1"
          NEEDS_EXTRA=""
          for spec in $BUNDLE_DEPS; do
            SONAME="${spec%%|*}"; DEB="${spec##*|}"
            SONAME_RE="$(echo "$SONAME" | sed 's/\./\\./g')"
            if readelf -d /pkg/virgl/usr/lib/libGL.so.1.7.0 | grep -q "NEEDED.*${SONAME_RE}"; then
              echo "$SONAME needed -- fetching $DEB for a private copy"
              (cd /tmp/extra-libs && apt-get download "$DEB")
              dpkg-deb -x /tmp/extra-libs/${DEB}_*.deb /tmp/extra-libs
              SRC="$(find /tmp/extra-libs -name "$SONAME" | head -n1)" || true
              if [ -z "$SRC" ]; then
                echo "FATAL: $DEB .deb did not contain $SONAME" >&2
                exit 1
              fi
              cp -L "$SRC" /pkg/virgl/usr/lib/"$SONAME"
              NEEDS_EXTRA="$NEEDS_EXTRA $SONAME"
            fi
          done
          EXTRA_N="$(echo "$NEEDS_EXTRA" | wc -w)"
          echo "bundled extra deps:[$NEEDS_EXTRA ]"

          echo "==> Verifying package file count"
          VIRGL_COUNT="$(find /pkg/virgl -type f | wc -l)"
          # Baseline is 1 file (the driver) plus one extra file for each dep
          # conditionally bundled above.
          VIRGL_EXPECTED=$((1 + EXTRA_N))
          if [ "$VIRGL_COUNT" -ne "$VIRGL_EXPECTED" ]; then
            echo "FATAL: virgl package expected ${VIRGL_EXPECTED} files, found ${VIRGL_COUNT}" >&2
            find /pkg/virgl -type f >&2
            exit 1
          fi

          echo "==> Packaging as .tzst archive"
          cd /pkg/virgl
          tar --zstd -cf "/artifacts/virgl-${MESA_VERSION}.tzst" $(find . -type f -printf '%P\n')
          sha256sum "/artifacts/virgl-${MESA_VERSION}.tzst" \
            > "/artifacts/virgl-${MESA_VERSION}.tzst.sha256"

          echo "==> Contents:"
          tar --zstd -tvf "/artifacts/virgl-${MESA_VERSION}.tzst"

          echo "==> Done"
          ls -lh /artifacts
          BUILD_SCRIPT
          chmod +x "${{ github.workspace }}/build.sh"

      - name: Build inside emulated aarch64 ubuntu:22.04 container
        run: |
          docker run --rm \
            --platform linux/arm64 \
            -e MESA_VERSION="${{ env.MESA_VERSION }}" \
            -v "${{ github.workspace }}/build.sh:/build.sh:ro" \
            -v "${{ github.workspace }}/artifacts:/artifacts" \
            ubuntu:22.04 \
            bash /build.sh

      - name: Verify archive is well-formed and contains the mandatory file
        run: |
          VIRGL_FILE="artifacts/virgl-${{ env.MESA_VERSION }}.tzst"
          test -s "$VIRGL_FILE"
          zstd -t "$VIRGL_FILE"

          # Entry counts are not fixed: support libs are bundled only if the
          # produced binary actually needs them, so check for the MANDATORY
          # file's presence instead of an exact count.
          VIRGL_LISTING="$(tar --zstd -tf "$VIRGL_FILE")"

          if ! echo "$VIRGL_LISTING" | grep -qx 'usr/lib/libGL.so.1.7.0'; then
            echo "FATAL: virgl archive is missing usr/lib/libGL.so.1.7.0" >&2
            echo "$VIRGL_LISTING" >&2
            exit 1
          fi

          # VirGL is OpenGL-slot-only: the archive must NOT contain a Vulkan
          # ICD manifest or lavapipe-style ICD .so. Either one would fight the
          # Vulkan slot's own manifest under usr/share/vulkan/icd.d when both
          # slots extract into the same rootDir.
          if echo "$VIRGL_LISTING" | grep -q 'vulkan/icd.d\|libvulkan_'; then
            echo "FATAL: virgl archive unexpectedly contains Vulkan ICD files" >&2
            echo "$VIRGL_LISTING" >&2
            exit 1
          fi

          echo "virgl archive OK: $(du -h "$VIRGL_FILE" | cut -f1)"
          echo "$VIRGL_LISTING"

      - name: Diagnose ABI compatibility of produced binary
        run: |
          mkdir -p /tmp/abi-check
          tar --zstd -xf "artifacts/virgl-${{ env.MESA_VERSION }}.tzst" -C /tmp/abi-check
          sudo apt-get install -y --no-install-recommends binutils-aarch64-linux-gnu > /dev/null
          f=/tmp/abi-check/usr/lib/libGL.so.1.7.0
          echo "--- $f ---"
          echo "File type / architecture (must be ARM aarch64):"
          file "$f"
          MACHINE="$(aarch64-linux-gnu-readelf -h "$f" | grep 'Machine:' || true)"
          echo "$MACHINE"
          if ! echo "$MACHINE" | grep -q 'AArch64'; then
            echo "FATAL: $f is not an AArch64 binary -- the emulated arm64 build did not take effect" >&2
            exit 1
          fi
          echo "NEEDED (runtime library dependencies):"
          aarch64-linux-gnu-readelf -d "$f" | grep NEEDED || true
          echo "SONAME:"
          aarch64-linux-gnu-readelf -d "$f" | grep SONAME || true
          echo "Max GLIBC symbol version required:"
          aarch64-linux-gnu-objdump -T "$f" 2>/dev/null | grep -oP 'GLIBC_[0-9.]+' | sort -V -u | tail -1 || true
          echo "Max GLIBCXX symbol version required:"
          aarch64-linux-gnu-objdump -T "$f" 2>/dev/null | grep -oP 'GLIBCXX_[0-9.]+' | sort -V -u | tail -1 || true
          if aarch64-linux-gnu-readelf -d "$f" | grep -qi 'NEEDED.*libLLVM'; then
            echo "FATAL: $f still depends on a shared libLLVM -- -Dllvm=disabled did not take effect" >&2
            exit 1
          fi
          # virpipe proof: GALLIUM_DRIVER=virpipe (set app-side in the VIRGL
          # branch) only resolves if virpipe is actually baked into this
          # libGL. A wrong gallium-drivers value would load yet serve no
          # virpipe device -- the "driver not detected" signature.
          if ! aarch64-linux-gnu-strings "$f" | grep -q 'virpipe'; then
            echo "FATAL: virpipe not found in $f -- gallium-drivers=virgl did not take effect; GALLIUM_DRIVER=virpipe would resolve nothing" >&2
            exit 1
          fi
          if aarch64-linux-gnu-strings "$f" | grep -q 'llvmpipe'; then
            echo "FATAL: llvmpipe found in $f -- wrong gallium driver baked in" >&2
            exit 1
          fi
          echo "virpipe baked in OK"
          # GLVND-split guard (same as the llvmpipe flow): frost-v3's OpenGL
          # slot ships libGL.so.1.7.0 as a SINGLE self-contained file
          # (glx=xlib bakes the gallium driver + glapi in). If a future
          # Mesa/glvnd-header change silently turns libGL into a GLVND
          # dispatcher, it would dlopen (NOT NEEDED -- invisible to the dep
          # gate below) libGLX_mesa.so.0 / libGLdispatch.so.0 at runtime,
          # files this project does NOT ship -- every GL client would then
          # fail with blank GPU info while all other gates stay green (the
          # exact "OpenGL not recognized" signature). Fail loudly here.
          if aarch64-linux-gnu-readelf -d "$f" | grep -qi 'NEEDED.*libGLX_mesa\|NEEDED.*libGLdispatch'; then
            echo "FATAL: libGL became a GLVND dispatcher (NEEDEDs libGLX_mesa/libGLdispatch) -- the single-file xlib assumption is broken; ship the split libs or force non-GLVND" >&2
            exit 1
          fi
          if ! aarch64-linux-gnu-readelf --dyn-syms "$f" | grep -qE ' glXCreateContext( |$)'; then
            echo "FATAL: libGL defines no glXCreateContext -- not a usable xlib GL provider" >&2
            exit 1
          fi
          if ! aarch64-linux-gnu-readelf --dyn-syms "$f" | grep -qE ' glXMakeCurrent( |$)'; then
            echo "FATAL: libGL defines no glXMakeCurrent -- not a usable xlib GL provider" >&2
            exit 1
          fi
          # The base rootfs only ships a libGL.so.1 symlink (pointing at
          # libGL.so.1.7.0); guests link DT_NEEDED libGL.so.1. If Mesa ever
          # changes libGL's SONAME, our renamed file would stop satisfying
          # the loader and every GL client would die -- fail loudly here.
          if ! aarch64-linux-gnu-readelf -d "$f" | grep -q 'SONAME.*libGL\.so\.1'; then
            echo "FATAL: libGL SONAME is not libGL.so.1 -- the rootfs libGL.so.1 symlink would dangle" >&2
            exit 1
          fi

      - name: Gate runtime deps against rootfs inventory and shipped drivers
        run: |
          # Every NEEDED library of the new driver must be satisfiable
          # on-device, otherwise dlopen fails and the driver is recognized
          # nowhere (blank GPU info / instant app close) -- the exact symptom
          # this gate exists to prevent. A dependency passes if EITHER:
          #   (a) a private copy is bundled inside our own package (/pkg), OR
          #   (b) a file of that basename exists in the base rootfs.tzst
          #       (checked out with the repo -- plain 62MB file, no LFS), OR
          #   (c) it is already NEEDED by one of the shipped, known-working
          #       driver archives (turnip/vortek/zink/virgl/gladio), which
          #       proves it loads in this rootfs even if the inventory check
          #       below missed it (e.g. a lib provided outside usr/lib).
          # Anything else fails LOUDLY here, naming the exact library, instead
          # of shipping a dead driver. NOTE libglapi.so.0 passes via (b): the
          # base rootfs ships it and the current virgl-23.1.9 asset already
          # proves that copy satisfies a virgl libGL at runtime. It is
          # deliberately never bundled (shadowing the rootfs file could break
          # the zink slot, which shares it).
          sudo apt-get install -y --no-install-recommends binutils-aarch64-linux-gnu > /dev/null
          # Resolve the assets dir: this workflow runs either directly in the
          # winlator-app repo (assets at app/src/main/assets) or in the
          # winlator-frost-v3 parent (app/ submodule mount, assets at
          # app/app/src/main/assets).
          ASSET_BASE=""
          for cand in "app/src/main/assets" "app/app/src/main/assets"; do
            if [ -f "$cand/rootfs.tzst" ]; then ASSET_BASE="$cand"; break; fi
          done
          if [ -z "$ASSET_BASE" ]; then
            echo "FATAL: rootfs.tzst found under neither app/src/main/assets nor app/app/src/main/assets -- workspace top level:" >&2
            ls -la >&2
            exit 1
          fi
          echo "==> Asset base: $ASSET_BASE"
          echo "==> Inventorying base rootfs libraries"
          tar --zstd -tf "$ASSET_BASE/rootfs.tzst" | sed 's|.*/||' | sort -u > /tmp/rootfs-files.txt
          wc -l /tmp/rootfs-files.txt
          if [ ! -s /tmp/rootfs-files.txt ]; then
            echo "FATAL: rootfs inventory is empty -- $ASSET_BASE/rootfs.tzst is unreadable" >&2
            exit 1
          fi
          echo "==> Collecting NEEDED sets of shipped working drivers"
          REFDIR=/tmp/ref-drivers
          rm -rf "$REFDIR"; mkdir -p "$REFDIR"
          for a in "$ASSET_BASE"/graphics_driver/turnip-*.tzst \
                   "$ASSET_BASE"/graphics_driver/vortek-*.tzst \
                   "$ASSET_BASE"/graphics_driver/zink-*.tzst \
                   "$ASSET_BASE"/graphics_driver/virgl-*.tzst \
                   "$ASSET_BASE"/graphics_driver/gladio-*.tzst; do
            [ -f "$a" ] || continue
            echo "  reference: $a"
            tar --zstd -xf "$a" -C "$REFDIR"
          done
          aarch64-linux-gnu-readelf -d "$REFDIR"/usr/lib/*.so 2>/dev/null | grep NEEDED | sed 's/.*\[\(.*\)\]/\1/' | sort -u > /tmp/ref-needed.txt
          echo "Proven-loadable NEEDED set from shipped drivers:"
          cat /tmp/ref-needed.txt
          FAIL=0
          f=/tmp/abi-check/usr/lib/libGL.so.1.7.0
          echo "--- deps of $(basename "$f") ---"
          for lib in $(aarch64-linux-gnu-readelf -d "$f" | grep NEEDED | sed 's/.*\[\(.*\)\]/\1/'); do
            if [ -f "/tmp/abi-check/usr/lib/$lib" ]; then
              echo "  OK (bundled private copy): $lib"
            elif grep -qx "$lib" /tmp/rootfs-files.txt; then
              echo "  OK (in base rootfs): $lib"
            elif grep -qx "$lib" /tmp/ref-needed.txt; then
              echo "  OK (used by a shipped driver): $lib"
            else
              echo "  FATAL: $lib is NEEDED by $(basename "$f") but is NOT bundled, NOT in rootfs.tzst, and used by NO shipped driver -- dlopen will fail on-device" >&2
              FAIL=1
            fi
          done
          exit $FAIL

      - name: Upload driver artifacts
        uses: actions/upload-artifact@v4
        with:
          name: virgl-${{ env.MESA_VERSION }}-aarch64
          path: |
            artifacts/virgl-*.tzst
            artifacts/virgl-*.tzst.sha256
          if-no-files-found: error
          retention-days: 30
